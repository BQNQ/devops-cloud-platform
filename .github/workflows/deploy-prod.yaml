name: Deploy prod
on:
    pull_request:
        types: [closed]
        branches:
            - main
        # paths:
        #     - app/**

permissions:
    contents: write
jobs:
    deploy:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Update deployment.yaml
              run: |
                  sed -i "s|image: .*|image: ${{ vars.ECR_URI}}:${{ github.event.pull_request.head.sha }}|" k8s/deployment.yaml

            - name: Commit changes
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@users.noreply.github.com"

                  git add k8s/deployment.yaml
                  git commit -m "Update image to ${{ github.event.pull_request.head.sha }}" || exit 0
                  git push
