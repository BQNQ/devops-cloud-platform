deploymentMode: SimpleScalable

loki:
  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    schemaConfig:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage:
      type: s3
      bucketNames:
        chunks: loki-36021379213
        ruler: loki-36021379213
        admin: loki-36021379213

      s3:
        endpoint: s3.eu-central-1.amazonaws.com
        region: eu-central-1
        s3ForcePathStyle: false
        insecure: false

    extraEnvFrom:
      - secretRef:
          name: loki-s3
